      /* Scroll Snapping specifically for the menu pages */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* We will scroll on the container instead */
        background-color: var(--main-background);
      }

      #app {
        height: 100vh;
      }

      .menu-scroll-container {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: row;
        overflow-x: scroll;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      
      .menu-scroll-container::-webkit-scrollbar {
        display: none;
      }

      .menu-page-snap {
        height: 100vh;
        scroll-snap-align: start;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        flex-shrink: 0;
      }

      .menu-page-img {
        height: 100vh;
        width: auto;
        object-fit: contain; 
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .menu-page-img.visible {
        opacity: 1;
        transform: scale(1);
      }

      /* Horizontal Scroll Indicator */
      .scroll-indicator {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 0.5rem;
        color: var(--light-olive);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        animation: slide 2s infinite;
        opacity: 0.8;
        z-index: 50;
      }
      
      .scroll-indicator svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        transform: rotate(-90deg); /* Point right */
      }

      @keyframes slide {
        0%, 20%, 50%, 80%, 100% {
          transform: translateX(0);
        }
        40% {
          transform: translateX(15px);
        }
        60% {
          transform: translateX(7px);
        }
      }
      
      /* The footer will just be the last snap point horizontally */
      .footer-snap {
        scroll-snap-align: start;
        min-width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: var(--main-background);
        flex-shrink: 0;
      }
    </style>

    <script>
      // Intersection Observer for fade-in animations as you scroll snap
      document.addEventListener("DOMContentLoaded", () => {
        const images = document.querySelectorAll('.menu-page-img');
        
        const observerOptions = {
          root: document.querySelector('.menu-scroll-container'),
          rootMargin: '0px',
          threshold: 0.5 // Trigger when 50% of the image is in view
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
            } else {
              // Optional: remove visible class if you want them to fade out when scrolling away
              // entry.target.classList.remove('visible'); 
            }
          });
        }, observerOptions);

        images.forEach(img => {
          observer.observe(img);
        });

        // Vertical scroll to horizontal slide translation
        const scrollContainer = document.querySelector('.menu-scroll-container');
        let isScrolling = false;

        scrollContainer.addEventListener('wheel', (evt) => {
          // If the user is scrolling vertically
          if (Math.abs(evt.deltaY) > Math.abs(evt.deltaX)) {
            evt.preventDefault();
            
            if (isScrolling) return;
            
            // Scroll down = positive deltaY -> Move Right
            // Scroll up = negative deltaY -> Move Left
            const direction = evt.deltaY > 0 ? 1 : -1;
            
            scrollContainer.scrollBy({
              left: direction * window.innerWidth,
              behavior: 'smooth'
            });
            
            // Throttle the scroll to ensure one slide per wheel action
            // This prevents rapid spinning and aligns with the snapping
            isScrolling = true;
            setTimeout(() => {
              isScrolling = false;
            }, 700); 
          }
        }, { passive: false });
      });
    </script>
